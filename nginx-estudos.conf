server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Páginas de estudo da Fiorella: fora dos buscadores
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz { access_log off; return 200 "ok"; }

    # /ciencias, /ciencias/ e futuras matérias (/matematica ...)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.html$ { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
}
