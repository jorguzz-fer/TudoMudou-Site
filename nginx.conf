server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check usado pelo Docker/Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Imagens e fontes: cache longo
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # CSS e JS: cache curto. O index.html referencia com ?v=... para forçar atualização.
    location ~* \.(css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML: sempre revalidar
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
