<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Estudos da Fiorella</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#11151d);--ink:light-dark(#1d2433,#eef1f6);--soft:light-dark(#5a6375,#a9b2c3);--line:light-dark(#e3e7ee,#2a3140)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif}
header{background:#5b3fd0;color:#fff;padding:40px max(5vw,16px)}h1{font:800 clamp(34px,7vw,52px)/1.05 "Baloo 2",sans-serif;margin:0}
header p{color:#e8e3ff;margin:.4em 0 0}main{padding:28px max(5vw,16px);max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
a.card{display:block;text-decoration:none;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:20px;min-height:44px}
a.card:hover,a.card:focus-visible{border-color:#5b3fd0;outline:none}a.card b{font:800 26px "Baloo 2",sans-serif;display:block}
.tag{display:inline-block;background:#2f9a45;color:#fff;font-weight:800;font-size:14px;padding:2px 10px;border-radius:99px;margin-bottom:8px}
span.s{color:var(--soft);font-weight:600}
</style></head><body>
<header><h1>Estudos da Fiorella</h1><p>3º ano · Provas do 3º trimestre</p></header>
<main>
<a class="card" href="/ciencias/"><span class="tag">Prova 25/11</span><b>Ciências</b><span class="s">Classificação dos animais, peixes, anfíbios, répteis, aves e mamíferos. Plano, flashcards, simulado e prova.</span></a>
</main></body></html>
